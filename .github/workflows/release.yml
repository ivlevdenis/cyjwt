# cyjwt release: build sdist + manylinux wheels on a v* tag and publish to PyPI.
#
#   git tag -a v0.2.0 -m "cyjwt 0.2.0" && git push origin v0.2.0
#
# Trigger: a v* tag; workflow_dispatch builds without publishing.
# Publishing uses the PyPI API token from the repository secret PYPI_API_TOKEN.
# Alternative: Trusted Publishing (OIDC, no secret) — drop `password` here and
# configure a publisher on pypi.org: project cyjwt, owner ivlevdenis, repo cyjwt,
# workflow release.yml, environment pypi.
#
# Wheels are built with cibuildwheel inside manylinux_2_28 (glibc >= 2.28) for
# cp312-cp315. PyPI rejects bare `linux_x86_64` wheels, so `python -m build
# --wheel` on the runner is not used.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("src/cyjwt/_version.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )"
          if [ "$tag" != "$version" ]; then
            echo "tag '$tag' does not match package version '$version'"
            exit 1
          fi
      - run: pip install build twine
      - name: Build sdist
        run: python -m build --sdist --outdir dist
      - name: Build manylinux wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: dist
        env:
          CIBW_BUILD: >-
            cp312-manylinux_x86_64
            cp313-manylinux_x86_64
            cp314-manylinux_x86_64
            cp315-manylinux_x86_64
          CIBW_ARCHS: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      - name: Verify wheel platform tags
        run: |
          python - <<'PY'
          import glob
          import sys

          dists = sorted(glob.glob("dist/*"))
          print("built:", *dists, sep="\n  ")
          bad = [
              path
              for path in dists
              if path.endswith(".whl") and "manylinux" not in path
          ]
          if bad:
              sys.exit(f"PyPI will reject non-portable wheel(s): {bad}")
          if not any(path.endswith(".tar.gz") for path in dists):
              sys.exit("sdist is missing")
          if len([path for path in dists if path.endswith(".whl")]) != 4:
              sys.exit("expected four cpXYZ-manylinux wheels")
          PY
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cyjwt/
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish distributions to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # a repeated release run must not fail on "file already exists"
          skip-existing: true
