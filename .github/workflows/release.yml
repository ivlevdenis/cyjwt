# cyjwt release: build sdist + wheel on a v* tag and publish to PyPI.
#
#   git tag -a v0.2.0 -m "cyjwt 0.2.0" && git push origin v0.2.0
#
# Trigger: a v* tag; workflow_dispatch builds without publishing.
# Publishing uses the PyPI API token from the repository secret PYPI_API_TOKEN.
# Alternative: Trusted Publishing (OIDC, no secret) — drop `password` here and
# configure a publisher on pypi.org: project cyjwt, owner ivlevdenis, repo cyjwt,
# workflow release.yml, environment pypi.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("src/cyjwt/_version.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )"
          if [ "$tag" != "$version" ]; then
            echo "tag '$tag' does not match package version '$version'"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cyjwt/
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish distributions to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # a repeated release run must not fail on "file already exists"
          skip-existing: true
